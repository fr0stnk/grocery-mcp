# Optional: run the combined server over HTTP and connect it to ChatGPT
# through an OpenAI Secure MCP Tunnel. See tunnel/README.md.
#   docker compose -f compose.yaml -f compose.tunnel.yaml up -d grocery-http tunnel
x-tunnel-client: &tunnel-client
  image: ${GROCERY_IMAGE_PREFIX:-ghcr.io/fr0stnk/grocery-mcp}-tunnel:${GROCERY_IMAGE_TAG:-latest}
  restart: unless-stopped
  depends_on: [grocery-http]
  network_mode: host
  command: ["run", "--config", "/config/tunnel.yaml"]
  # After a reboot, Docker may start the tunnel before grocery-http is
  # listening. Without a startup wait, tunnel-client marks its startup catalog
  # as failed and disables polling until it is restarted by hand.
  environment:
    - MCP_STARTUP_WAIT_TIMEOUT=180s
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 64
  tmpfs: ["/tmp:size=32m,noexec,nosuid,nodev"]
  logging:
    driver: json-file
    options: {max-size: "5m", max-file: "2"}

services:
  grocery-http:
    image: ${GROCERY_IMAGE_PREFIX:-ghcr.io/fr0stnk/grocery-mcp}-grocery:${GROCERY_IMAGE_TAG:-latest}
    restart: unless-stopped
    # Host networking keeps the listener on loopback only and uses the host's
    # DNS, so no port is published and no bridge DNS workaround is needed.
    network_mode: host
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    tmpfs: ["/tmp:size=64m,nosuid,nodev"]
    environment:
      - RAMI_LEVY_BEARER_TOKEN
      - RAMI_LEVY_ECOM_TOKEN
      - RAMI_LEVY_USER_AGENT
      - RAMI_LEVY_COOKIE
      - RAMI_LEVY_STORE
      - SHUFERSAL_USERNAME
      - SHUFERSAL_PASSWORD
      - GROCERY_STORES
      - GROCERY_MASTER_KEY
      - GROCERY_MASTER_KEYS_OLD
      - GROCERY_OWNER_EMAIL
      - GROCERY_SHUFERSAL_DELIVERY_FEE
      - GROCERY_SHUFERSAL_SERVICE_FEE
      - GROCERY_SHUFERSAL_MINIMUM_ORDER
      - GROCERY_RAMI_LEVY_DELIVERY_FEE
      - GROCERY_RAMI_LEVY_SERVICE_FEE
      - GROCERY_RAMI_LEVY_MINIMUM_ORDER
      - GROCERY_IMAGE_TAG=${GROCERY_IMAGE_TAG:-latest}
      - GROCERY_READ_ONLY
      - GROCERY_HTTP=127.0.0.1:8791
      - GROCERY_ACCOUNT_HTTP
      - GROCERY_ACCOUNT_HOSTS
      - GROCERY_PUBLIC_HTTP
      - GROCERY_PUBLIC_URL
      - GROCERY_OAUTH_ISSUER
      - GROCERY_OAUTH_AUDIENCE
      - GROCERY_OAUTH_USERS
    volumes:
      - rami-data:/data/rami-levy
      - shufersal-data:/data/shufersal
      - grocery-data:/data/grocery
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}

  tunnel:
    <<: *tunnel-client
    volumes:
      - ./tunnel/runtime/tunnel-client:/opt/tunnel-client:ro
      - ./tunnel/tunnel.yaml:/config/tunnel.yaml:ro
      - ./tunnel/secrets/openai-tunnel.key:/run/secrets/openai-tunnel.key:ro

  # A second tunnel for another ChatGPT account, such as a personal account
  # outside the first tunnel's workspace. It serves the same grocery-http.
  # Configure it with: python3 scripts/setup_openai_tunnel.py --name extra
  tunnel-extra:
    <<: *tunnel-client
    profiles: [extra]
    volumes:
      - ./tunnel/runtime/tunnel-client:/opt/tunnel-client:ro
      - ./tunnel/extra.yaml:/config/tunnel.yaml:ro
      - ./tunnel/secrets/extra.key:/run/secrets/openai-tunnel.key:ro

  # Pocket ID, the sign-in service for the public listener (see deploy/README.md).
  # Off unless the auth profile is enabled:
  #   docker compose -f compose.yaml -f compose.tunnel.yaml --profile auth up -d pocket-id
  pocket-id:
    # v2.19.3-distroless, pinned by its multi-arch index digest. It runs as user 65532 with no shell.
    image: ghcr.io/pocket-id/pocket-id:v2.19.3-distroless@sha256:6a0045a89b80fa6624c091786e7be132a4dde880ca64727a6b019c056b091982
    profiles: [auth]
    restart: unless-stopped
    # Host networking with HOST=127.0.0.1 keeps it on loopback, reachable only through the reverse proxy.
    network_mode: host
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    tmpfs: ["/tmp:size=32m,noexec,nosuid,nodev"]
    environment:
      # Both come from the ignored .env; Pocket ID refuses to start without the encryption key.
      # Required (:?) would break every compose command while the profile is off.
      - APP_URL=${POCKET_ID_URL:-}
      - ENCRYPTION_KEY=${POCKET_ID_ENCRYPTION_KEY:-}
      - HOST=127.0.0.1
      - PORT=1411
      # The proxy runs on this host and connects from loopback.
      - TRUST_PROXY=127.0.0.1
      # Hosts Pocket ID may fetch client metadata documents (CIMD) from, comma-separated; see deploy/README.md.
      - OUTBOUND_ALLOWED_HOSTS_CLIENT_METADATA=${POCKET_ID_METADATA_HOSTS:-}
    volumes:
      - pocket-id-data:/app/data
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}

volumes:
  pocket-id-data:
