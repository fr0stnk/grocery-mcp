name: Test and publish images

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Only changes that affect the images. GitHub ignores path filters for tag pushes.
    paths:
      - Dockerfile
      - .dockerignore
      - .gitmodules
      - "server/**"
      - "!server/**/*.md"
      - "upstream/**"
      - .github/workflows/images.yml
  pull_request:
    # Only changes that affect the images. GitHub ignores path filters for tag pushes.
    paths:
      - Dockerfile
      - .dockerignore
      - .gitmodules
      - "server/**"
      - "!server/**/*.md"
      - "upstream/**"
      - .github/workflows/images.yml
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Check that a release tag matches server/package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match server/package.json version $version"
            exit 1
          fi
      - run: npm ci
      - run: npm run lint
      - name: Test with coverage thresholds
        run: npm run coverage 2>&1 | tee coverage.txt
      - name: Coverage summary
        if: always()
        run: |
          {
            echo '### Test coverage'
            echo '```'
            sed -n '/start of coverage report/,/end of coverage report/p' coverage.txt | sed 's/^# //'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # A release tag points at a commit that main already built: reuse those
  # images instead of building the same commit again. The main run usually
  # starts at the same moment, so wait for it to publish first.
  retag:
    name: Reuse the main build
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      reused: ${{ steps.retag.outputs.reused }}
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Wait for the commit's images, then tag them with the version
        id: retag
        env:
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          source="sha-${SHA::7}"
          targets="grocery rami-levy shufersal tunnel"
          deadline=$(( $(date +%s) + 1800 ))
          for target in $targets; do
            until docker buildx imagetools inspect "ghcr.io/$OWNER/grocery-mcp-$target:$source" >/dev/null 2>&1; do
              if [ "$(date +%s)" -ge "$deadline" ]; then
                echo "::notice::No $source image for $target after 30 minutes; building instead"
                echo "reused=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              sleep 20
            done
          done
          for target in $targets; do
            image="ghcr.io/$OWNER/grocery-mcp-$target"
            docker buildx imagetools create -t "$image:$version" "$image:$source"
            echo "$image:$version -> $source"
          done
          echo "reused=true" >> "$GITHUB_OUTPUT"
          echo "### Reused the main build $source for $GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"

  image:
    needs: [test, retag]
    # Branches and pull requests build; a release tag builds only when there was nothing to reuse.
    if: always() && needs.test.result == 'success' && (needs.retag.result == 'skipped' || needs.retag.outputs.reused != 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: [grocery, rami-levy, shufersal, tunnel]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Collect build metadata
        id: build
        run: |
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "rami=$(git -C upstream/rami-levy-mcp rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "shufersal=$(git -C upstream/shufersal-cart rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/grocery-mcp-${{ matrix.target }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=ref,event=pr
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GROCERY_COMMIT=${{ github.sha }}
            GROCERY_BUILD_DATE=${{ steps.build.outputs.date }}
            GROCERY_UPSTREAM_RAMI_LEVY=${{ steps.build.outputs.rami }}
            GROCERY_UPSTREAM_SHUFERSAL=${{ steps.build.outputs.shufersal }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,scope=${{ matrix.target }},mode=max
