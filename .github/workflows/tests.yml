name: Tests

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "!server/**/*.md"
      - "scripts/**"
      - "!scripts/**/*.md"
      - .github/workflows/tests.yml
  pull_request:
    paths:
      - "server/**"
      - "!server/**/*.md"
      - "scripts/**"
      - "!scripts/**/*.md"
      - .github/workflows/tests.yml
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: Server (lint, tests, coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Test with coverage thresholds
        run: npm run coverage 2>&1 | tee coverage.txt
      - name: Coverage summary
        if: always()
        run: |
          {
            echo '### Server test coverage'
            echo '```'
            sed -n '/start of coverage report/,/end of coverage report/p' coverage.txt | sed 's/^# //'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  scripts:
    name: Scripts (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s scripts/tests -v
