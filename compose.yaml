name: grocery-mcp
services:
  rami-levy:
    image: ${GROCERY_IMAGE_PREFIX:-ghcr.io/fr0stnk/grocery-mcp}-rami-levy:${GROCERY_IMAGE_TAG:-latest}
    stdin_open: true
    environment:
      - RAMI_LEVY_BEARER_TOKEN
      - RAMI_LEVY_ECOM_TOKEN
      - RAMI_LEVY_USER_AGENT
      - RAMI_LEVY_COOKIE
      - RAMI_LEVY_STORE
    volumes:
      - rami-data:/data

  shufersal:
    image: ${GROCERY_IMAGE_PREFIX:-ghcr.io/fr0stnk/grocery-mcp}-shufersal:${GROCERY_IMAGE_TAG:-latest}
    stdin_open: true
    environment:
      - SHUFERSAL_USERNAME
      - SHUFERSAL_PASSWORD
    volumes:
      - shufersal-data:/data

  grocery:
    image: ${GROCERY_IMAGE_PREFIX:-ghcr.io/fr0stnk/grocery-mcp}-grocery:${GROCERY_IMAGE_TAG:-latest}
    stdin_open: true
    environment:
      - RAMI_LEVY_BEARER_TOKEN
      - RAMI_LEVY_ECOM_TOKEN
      - RAMI_LEVY_USER_AGENT
      - RAMI_LEVY_COOKIE
      - RAMI_LEVY_STORE
      - SHUFERSAL_USERNAME
      - SHUFERSAL_PASSWORD
      - GROCERY_STORES
      - GROCERY_MASTER_KEY
      - GROCERY_MASTER_KEYS_OLD
      - GROCERY_OWNER_EMAIL
      - GROCERY_IMAGE_TAG=${GROCERY_IMAGE_TAG:-latest}
    volumes:
      - rami-data:/data/rami-levy
      - shufersal-data:/data/shufersal
      - grocery-data:/data/grocery

volumes:
  rami-data:
  shufersal-data:
  grocery-data:
